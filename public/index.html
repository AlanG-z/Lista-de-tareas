<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/alerts.css">
    <style>
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div id="task-container">
        <div class="header">
            <h1>📝 Lista de Tareas</h1>
        </div>

        <div class="input-group">
            <input type="text" id="task-input" placeholder="Nueva tarea">
            <button id="add-task-btn">Agregar tarea</button>
        </div>
        
        <ul id="task-list">
            <!-- Las tareas se agregarán aquí dinámicamente -->
        </ul>
    </div>
   
    <!-- Alerta personalizada -->
    <div id="custom-alert" class="alert alert-hidden">
        <div class="alert-content">
            <p id="alert-message"></p>
            <button class="alert-close" onclick="cerrarAlerta()">×</button>
        </div>
    </div>

    <!-- Modal para editar tarea -->
    <div id="modal-editar" class="modal-overlay modal-hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Tarea</h2>
                <button class="modal-close" onclick="cerrarModalEditar()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="modal-input" placeholder="Nuevo texto para la tarea" class="modal-input">
            </div>
            <div class="modal-footer">
                <button class="btn-cancelar" onclick="cerrarModalEditar()">Cancelar</button>
                <button class="btn-guardar" onclick="guardarEdicion()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>

</body>
</html>
