[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  # Ignorar archivos y variables legítimas en escaneo de secretos
  SECRETS_SCAN_OMIT_PATHS = "DEPLOYMENT.md,NETLIFY.md,.github/**"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV"

[dev]
  command = "npm run dev"
  port = 3000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = "!has_extension"

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "staging"

[context.branch-deploy.environment]
  NODE_ENV = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
